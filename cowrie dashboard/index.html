<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cowrie Honeypot Dashboard</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    header {
      background: #111827;
      color: white;
      padding: 25px 35px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      color: #9ca3af;
    }

    .container {
      max-width: 1400px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: white;
      padding: 22px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .stat-card h3 {
      margin: 0 0 10px;
      font-size: 14px;
      color: #6b7280;
    }

    .stat-card p {
      margin: 0;
      font-size: 30px;
      font-weight: bold;
    }

    .charts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
      gap: 25px;
    }

    .chart-card {
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .chart-card h2 {
      margin-top: 0;
      font-size: 18px;
    }

    .chart-container {
      position: relative;
      height: 350px;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }
  </style>
</head>

<body>

<header>
  <h1>Cowrie Honeypot Dashboard</h1>
  <p>SSH attack activity and honeypot intelligence</p>
</header>

<div class="container">

  <div id="error" class="error"></div>

  <!-- Summary statistics -->
  <div class="stats">

    <div class="stat-card">
      <h3>Total Events</h3>
      <p id="totalEvents">-</p>
    </div>

    <div class="stat-card">
      <h3>Unique Source IPs</h3>
      <p id="uniqueIPs">-</p>
    </div>

    <div class="stat-card">
      <h3>Unique Usernames</h3>
      <p id="uniqueUsers">-</p>
    </div>

    <div class="stat-card">
      <h3>Unique Commands</h3>
      <p id="uniqueCommands">-</p>
    </div>

  </div>

  <!-- Charts -->
  <div class="charts">

    <div class="chart-card">
      <h2>Top Source IPs</h2>
      <div class="chart-container">
        <canvas id="ipChart"></canvas>
      </div>
    </div>

    <div class="chart-card">
      <h2>Top Login Usernames</h2>
      <div class="chart-container">
        <canvas id="usernameChart"></canvas>
      </div>
    </div>

    <div class="chart-card">
      <h2>Top Commands</h2>
      <div class="chart-container">
        <canvas id="commandChart"></canvas>
      </div>
    </div>

    <div class="chart-card">
      <h2>Event Types</h2>
      <div class="chart-container">
        <canvas id="eventChart"></canvas>
      </div>
    </div>

  </div>

</div>

<script>

async function loadData() {

  try {

    const response = await fetch("honeypot_summary.json");

    if (!response.ok) {
      throw new Error(
        `Could not load JSON file: ${response.status}`
      );
    }

    const data = await response.json();

    console.log("Cowrie data:", data);

    processData(data);

  } catch (error) {

    console.error(error);

    const errorBox = document.getElementById("error");

    errorBox.style.display = "block";

    errorBox.textContent =
      "Unable to load honeypot_summary.json. " +
      "Make sure the JSON file is in the same folder as index.html " +
      "and that the page is being served through a local web server.";

  }

}


function processData(data) {

  /*
   * This function attempts to work with several
   * common Cowrie JSON structures.
   */

  let events = [];

  if (Array.isArray(data)) {

    events = data;

  } else if (Array.isArray(data.events)) {

    events = data.events;

  } else if (Array.isArray(data.sessions)) {

    events = data.sessions;

  } else {

    /*
     * If your summary JSON contains aggregated
     * objects rather than individual events,
     * inspect it in the browser console.
     */

    console.log("JSON structure:", data);

    buildFromSummary(data);

    return;
  }

  buildDashboard(events);
}


function buildDashboard(events) {

  document.getElementById("totalEvents").textContent =
    events.length.toLocaleString();


  const ips = countValues(
    events,
    ["src_ip", "src_ip_address", "source_ip", "ip"]
  );

  const usernames = countValues(
    events,
    ["username", "user", "login"]
  );

  const commands = countValues(
    events,
    ["input", "command", "cmd"]
  );

  const eventTypes = countValues(
    events,
    ["eventid", "event", "event_type", "type"]
  );


  document.getElementById("uniqueIPs").textContent =
    Object.keys(ips).length.toLocaleString();

  document.getElementById("uniqueUsers").textContent =
    Object.keys(usernames).length.toLocaleString();

  document.getElementById("uniqueCommands").textContent =
    Object.keys(commands).length.toLocaleString();


  createBarChart(
    "ipChart",
    "Source IP",
    topEntries(ips, 10)
  );

  createBarChart(
    "usernameChart",
    "Username",
    topEntries(usernames, 10)
  );

  createBarChart(
    "commandChart",
    "Command",
    topEntries(commands, 10)
  );

  createBarChart(
    "eventChart",
    "Event Type",
    topEntries(eventTypes, 10)
  );
}


function countValues(events, possibleKeys) {

  const counts = {};

  events.forEach(event => {

    let value = null;

    for (const key of possibleKeys) {

      if (
        event[key] !== undefined &&
        event[key] !== null &&
        event[key] !== ""
      ) {
        value = event[key];
        break;
      }

    }

    if (value !== null) {

      value = String(value);

      counts[value] = (counts[value] || 0) + 1;

    }

  });

  return counts;
}


function topEntries(object, limit) {

  return Object.entries(object)
    .sort((a, b) => b[1] - a[1])
    .slice(0, limit);

}


function createBarChart(canvasId, label, entries) {

  const canvas = document.getElementById(canvasId);

  new Chart(canvas, {

    type: "bar",

    data: {

      labels: entries.map(item => item[0]),

      datasets: [{

        label: label,

        data: entries.map(item => item[1]),

        backgroundColor: "#2563eb"

      }]

    },

    options: {

      responsive: true,

      maintainAspectRatio: false,

      plugins: {

        legend: {
          display: false
        }

      },

      scales: {

        y: {
          beginAtZero: true,
          ticks: {
            precision: 0
          }
        }

      }

    }

  });

}


/*
 * Handles summary-style JSON.
 * This section can be customised once we see
 * the exact structure of your honeypot_summary.json.
 */

function buildFromSummary(data) {

  console.log("Summary-style JSON detected:", data);

  document.getElementById("totalEvents").textContent =
    data.total_events ??
    data.totalEvents ??
    "-";

  document.getElementById("uniqueIPs").textContent =
    data.unique_ips ??
    data.uniqueIPs ??
    "-";

  document.getElementById("uniqueUsers").textContent =
    data.unique_users ??
    data.uniqueUsers ??
    "-";

  document.getElementById("uniqueCommands").textContent =
    data.unique_commands ??
    data.uniqueCommands ??
    "-";

}


loadData();

</script>

</body>
</html>
